<!-- Skolify UI kit helpers. Include this file (include token + @shared/skolify/kit.html) once per screen, then call sk.* from a
     <script> to emit markup. All coordinates are slide px (use with phone "slideCoords": true). -->
<script>
  window.sk = window.sk || {
    // mortarboard-with-glasses logo mark
    logo: (w, h, color = '#111', eye = '#fff') => `<svg width="${w}" height="${h}" viewBox="0 0 50 34" preserveAspectRatio="none"><path d="M25 1 L49 9.5 L25 18 L1 9.5 Z" fill="${color}"/><path d="M11 13 V19 C11 21.5 39 21.5 39 19 V13 L25 18 Z" fill="${color}"/><path d="M45.5 10.5 V22" stroke="${color}" stroke-width="2"/><circle cx="45.5" cy="23.5" r="2.2" fill="${color}"/><circle cx="16.5" cy="26" r="6.6" fill="${eye}" stroke="${color}" stroke-width="3.6"/><circle cx="32.5" cy="26" r="6.6" fill="${eye}" stroke="${color}" stroke-width="3.6"/><path d="M22.5 25 Q24.5 22.5 26.5 25" stroke="${color}" stroke-width="2.6" fill="none"/></svg>`,
    // header bar: box [x0,y0,x1,y1]; brand = ink box of "Skolify"; logo = ink box of the mark
    // (optional, else derived from brand); me = [cx,cy,r] profile icon; tile = faint square behind the mark
    header: ({ box: [x0, y0, x1, y1], brand, logo, me, tile = false }) => {
      const bh = brand[3] - brand[1];
      const lw = logo ? logo[2] - logo[0] + 1 : Math.round(bh * 1.45), lh = logo ? logo[3] - logo[1] + 1 : Math.round(bh * 1.15);
      const lx = logo ? logo[0] : brand[0] - Math.round(bh * 0.95) - lw, ly = logo ? logo[1] : Math.round((brand[1] + brand[3]) / 2 - lh / 2 - bh * 0.05);
      const pad = Math.round(bh * 0.45);
      return `<div class="skh" style="left:${x0}px;top:${y0}px;width:${x1 - x0}px;height:${y1 - y0}px"></div>` +
        (tile ? `<div class="skh-tile" style="position:absolute;left:${lx - pad}px;top:${ly - pad * 1.3}px;width:${lw + pad * 2}px;height:${lh + pad * 2.6}px;background:#f7f7f7;border-radius:4px"></div>` : '') +
        `<div style="position:absolute;left:${lx}px;top:${ly}px">${sk.logo(lw, lh)}</div>` +
        `<div class="ska" data-fit="${brand.join(',')}" data-fit-label="Skolify header" style="left:${brand[0]}px;top:${brand[1] - bh * 0.25}px;font:800 ${bh * 1.05}px/1 Inter;color:#111;white-space:nowrap">Skolify</div>` +
        (me ? `<svg class="ska" style="left:${me[0] - me[2]}px;top:${me[1] - me[2]}px" width="${me[2] * 2}" height="${me[2] * 2}" viewBox="0 0 40 40"><circle cx="20" cy="20" r="20" fill="#2c3046"/><circle cx="20" cy="15.5" r="7" fill="#fff"/><path d="M7.5 31.5 C10 24.5 30 24.5 32.5 31.5 A17 17 0 0 1 7.5 31.5 Z" fill="#fff"/></svg>` : '');
    },
    // floating black chat bubble with the logo
    chat: (cx, cy, r) => `<div class="sk-chat" style="left:${cx - r}px;top:${cy - r}px;width:${r * 2}px;height:${r * 2}px">${sk.logo(r * 0.95, r * 0.76, '#fff', '#111')}</div>`,
    // text positioned by its reference ink box (auto-fit does the sizing)
    // mode: 'text' (default) fits size+spacing+position; 'move' only positions (use for text clipped by
    // a phone frame, whose measured box is clipped too — give it an explicit font size); null = no fit
    t: (box, html, style = '', label, mode = 'text') => `<div class="ska"${mode ? ` data-fit="${box.join(',')}"${mode !== 'text' ? ` data-fit-mode="${mode}"` : ''}` : ''}${label ? ` data-fit-label="${label}"` : ''} style="left:${box[0]}px;top:${box[1]}px;white-space:nowrap;line-height:1;${style}">${html}</div>`,
    // form controls (slide coordinates, box = outer rect [x0,y0,x1,y1])
    box: (b, style = '') => `<div class="ska" style="left:${b[0]}px;top:${b[1]}px;width:${b[2] - b[0]}px;height:${b[3] - b[1]}px;${style}"></div>`,
    input: (b, radius = 9) => sk.box(b, `background:#fff;border:1.5px solid #dcdfe3;border-radius:${radius}px`),
    select: (b, radius = 9) => sk.input(b, radius) + `<svg class="ska" style="left:${b[2] - 26}px;top:${(b[1] + b[3]) / 2 - 8}px" width="12" height="16" viewBox="0 0 12 16"><path d="M2.5 6 L6 2.5 L9.5 6 M2.5 10 L6 13.5 L9.5 10" stroke="#222" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
    pill: (b, bg = '#eef1f5') => sk.box(b, `background:${bg};border-radius:${(b[3] - b[1]) / 2}px`),
    card: (b, radius = 14, style = '') => sk.box(b, `background:#fff;border:1.5px solid #e6e8eb;border-radius:${radius}px;box-shadow:0 3px 10px rgba(0,0,0,.05);${style}`),
    badge: (b, bg = '#1265e0', radius = 7) => sk.box(b, `background:${bg};border-radius:${radius}px`),
    // round arrow/nav button: dir 'left'|'right'; dark=true for the filled black style
    roundBtn: (cx, cy, r, dir = 'right', dark = true) => `<div class="ska" style="left:${cx - r}px;top:${cy - r}px;width:${2 * r}px;height:${2 * r}px;border-radius:50%;background:${dark ? '#151515' : '#c9c9c9'};display:flex;align-items:center;justify-content:center"><svg width="${r * 0.6}" height="${r * 0.6}" viewBox="0 0 14 14"><path d="${dir === 'left' ? 'M9 2 L4 7 L9 12' : 'M5 2 L10 7 L5 12'}" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`,
    closeX: (cx, cy, size = 12, color = '#8a8a8a') => `<svg class="ska" style="left:${cx - size / 2}px;top:${cy - size / 2}px" width="${size}" height="${size}" viewBox="0 0 12 12"><path d="M1.5 1.5 L10.5 10.5 M10.5 1.5 L1.5 10.5" stroke="${color}" stroke-width="2" stroke-linecap="round"/></svg>`,
    tick: (cx, cy, r, bg = '#1b78e6') => `<div class="ska" style="left:${cx - r}px;top:${cy - r}px;width:${2 * r}px;height:${2 * r}px;border-radius:50%;background:${bg};display:flex;align-items:center;justify-content:center"><svg width="${r * 1.1}" height="${r * 1.1}" viewBox="0 0 30 30"><path d="M8 15.5 L13 20.5 L22 10.5" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`,
    // full-slide overlay wrapper for things that sit on top of / outside the phone frame (floating
    // cards, carousel arrows, chat bubble): use as a slide-level {"type":"html"} element at 0,0 1080x1920
    clip: (rect, radius, inner) => `<div class="ska" style="left:0;top:0;width:1080px;height:1920px;clip-path:inset(${rect[1]}px ${1080 - rect[2]}px ${1920 - rect[3]}px ${rect[0]}px round ${radius}px)">${inner}</div>`,
  };
</script>
