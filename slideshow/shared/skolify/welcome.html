  <svg class="a" id="swoosh" style="left:0;top:380px" width="561" height="647" viewBox="0 0 561 647"></svg>
  <script>
    (() => {
      const s = document.getElementById('swoosh');
      let d = '';
      // band A: sparse fan entering from the left edge under the heading, bending down the right edge
      for (let i = 0; i < 30; i++) {
        const t = i / 29;
        const y0 = 92 + t * 70, y1 = 250 + t * 380;
        const o = (0.16 + 0.26 * Math.sin(t * Math.PI)).toFixed(2);
        d += `<path d="M -5 ${y0} C 170 ${y0 + 8 + t * 25}, 420 ${y0 + 30 + t * 60}, 566 ${y1}" stroke="rgba(70,70,70,${o})" stroke-width="1" fill="none"/>`;
      }
      // band B: thin ribbon of finer lines twisting down through the lower half
      for (let i = 0; i < 26; i++) {
        const t = i / 25;
        const o = (0.12 + 0.4 * Math.sin(t * Math.PI)).toFixed(2);
        d += `<path d="M ${120 + t * 40} ${150 + t * 30} C ${215 + t * 25} ${250 + t * 12}, ${260 + t * 18} ${430 - t * 25}, ${300 + t * 55} ${650}" stroke="rgba(55,55,55,${o})" stroke-width="0.9" fill="none"/>`;
      }
      s.innerHTML = d;
    })();
  </script>
