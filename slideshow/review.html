<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Slideshow review</title>
<style>
  :root { --bg: #111; --fg: #eee; --muted: #888; --accent: #fdc904; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; display: flex; gap: 12px; align-items: center; padding: 8px 12px; background: #1b1b1b; flex-wrap: wrap; }
  header select, header button, header input { background: #2a2a2a; color: var(--fg); border: 1px solid #444; border-radius: 6px; padding: 4px 8px; font: inherit; }
  header button.on { border-color: var(--accent); color: var(--accent); }
  #slides { display: flex; flex-direction: column; gap: 18px; padding: 12px; }
  .slide h3 { margin: 0 0 6px; font-size: 13px; color: var(--muted); font-weight: 500; }
  .slide h3 b { color: var(--fg); }
  .view { position: relative; overflow: hidden; background: #000; }
  .view canvas { display: block; image-rendering: pixelated; }
  .pair { display: flex; gap: 8px; }
  .label { color: var(--muted); font-size: 11px; }
</style>
</head>
<body>
<header>
  <select id="post"></select>
  <span>mode</span>
  <button data-mode="side" class="on">side by side</button>
  <button data-mode="onion">onion</button>
  <button data-mode="diff">diff</button>
  <button data-mode="blink">blink</button>
  <label>opacity <input id="alpha" type="range" min="0" max="1" step="0.05" value="0.5"></label>
  <label>zoom <input id="zoom" type="number" min="0.1" max="4" step="0.05" value="0.3" style="width:60px"></label>
  <span id="status" class="label"></span>
</header>
<div id="slides"></div>
<script>
// Compares out/NN-*.png (renders) with references listed in post.json "references" (URLs or
// paths relative to the post dir) or, failing that, images in posts/<name>/reference/.
const S = { mode: 'side', alpha: 0.5, zoom: 0.3, crop: null, slides: [], timers: [] };
window.review = S;

const load = (src) => new Promise((res, rej) => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => res(i); i.onerror = () => rej(new Error('failed ' + src)); i.src = src; });
const pixels = (img, w, h) => { const c = new OffscreenCanvas(w, h); const g = c.getContext('2d'); g.drawImage(img, 0, 0, w, h); return g.getImageData(0, 0, w, h); };

function score(a, b) {
  let sum = 0, off = 0; const n = a.data.length / 4;
  for (let i = 0; i < a.data.length; i += 4) {
    const d = (Math.abs(a.data[i] - b.data[i]) + Math.abs(a.data[i + 1] - b.data[i + 1]) + Math.abs(a.data[i + 2] - b.data[i + 2])) / 3;
    sum += d; if (d > 40) off++;
  }
  return { meanDiff: +(sum / n).toFixed(2), pctOff: +(100 * off / n).toFixed(2), similarity: +(100 - (100 * sum / n / 255)).toFixed(2) };
}

async function init() {
  const posts = await fetch('/api/posts').then((r) => r.json());
  const sel = document.getElementById('post');
  sel.innerHTML = posts.map((p) => `<option>${p}</option>`).join('');
  const want = new URLSearchParams(location.search).get('post');
  if (want) sel.value = want;
  sel.onchange = () => { history.replaceState(null, '', '?post=' + sel.value); open(sel.value); };
  document.querySelectorAll('[data-mode]').forEach((b) => (b.onclick = () => setMode(b.dataset.mode)));
  document.getElementById('alpha').oninput = (e) => { S.alpha = +e.target.value; draw(); };
  document.getElementById('zoom').oninput = (e) => { S.zoom = +e.target.value; draw(); };
  await open(sel.value);
}

function setMode(m) { S.mode = m; document.querySelectorAll('[data-mode]').forEach((b) => b.classList.toggle('on', b.dataset.mode === m)); draw(); }

async function open(name) {
  const base = `/posts/${name}/`;
  const post = await fetch(base + 'post.json', { cache: 'no-store' }).then((r) => r.json());
  const outs = (await fetch(`/api/ls/posts/${name}/${post.outDir || 'out'}`).then((r) => r.json())).filter((f) => f.endsWith('.png')).sort();
  let refs = (post.references || []).map((r) => (/^https?:/.test(r) ? r : base + r));
  if (!refs.length) refs = (await fetch(`/api/ls/posts/${name}/reference`).then((r) => r.json())).filter((f) => /\.(png|jpe?g|webp)$/i.test(f)).sort().map((f) => base + 'reference/' + f);
  const [W, H] = post.size || [1080, 1920];
  S.slides = [];
  for (let i = 0; i < outs.length; i++) {
    const mine = await load(base + (post.outDir || 'out') + '/' + outs[i] + '?t=' + Date.now());
    let ref = null; try { if (refs[i]) ref = await load(refs[i]); } catch (e) { console.warn(e.message); }
    const a = pixels(mine, W, H), b = ref ? pixels(ref, W, H) : null;
    S.slides.push({ name: outs[i], mine: a, ref: b, score: b ? score(a, b) : null });
  }
  document.getElementById('status').textContent = S.slides.map((s, i) => `${i + 1}: ${s.score ? s.score.similarity + '%' : 'no ref'}`).join('  ·  ');
  draw();
}

// Optional crop: review.crop = [x, y, w, h] in slide pixels (e.g. set from the console) then draw().
function draw() {
  const root = document.getElementById('slides');
  S.timers.forEach(clearInterval); S.timers = [];
  root.innerHTML = '';
  S.slides.forEach((s, i) => {
    if (S.only && S.only !== i + 1) return; // review.only = N shows a single slide
    const [cx, cy, cw, ch] = S.crop || [0, 0, s.mine.width, s.mine.height];
    const div = document.createElement('div'); div.className = 'slide';
    div.innerHTML = `<h3><b>${i + 1}. ${s.name}</b> ${s.score ? `similarity ${s.score.similarity}% · mean Δ ${s.score.meanDiff} · ${s.score.pctOff}% px off` : '(no reference)'}</h3>`;
    const mk = (img, mode) => {
      const c = document.createElement('canvas'); c.width = cw * S.zoom; c.height = ch * S.zoom;
      const tmp = new OffscreenCanvas(cw, ch); const g = tmp.getContext('2d');
      if (mode === 'diff' && s.ref) {
        const out = g.createImageData(cw, ch);
        for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) {
          const k = ((cy + y) * s.mine.width + cx + x) * 4, o = (y * cw + x) * 4;
          const d = Math.min(255, 3 * (Math.abs(s.mine.data[k] - s.ref.data[k]) + Math.abs(s.mine.data[k + 1] - s.ref.data[k + 1]) + Math.abs(s.mine.data[k + 2] - s.ref.data[k + 2])) / 3);
          const gray = (s.ref.data[k] + s.ref.data[k + 1] + s.ref.data[k + 2]) / 12;
          out.data[o] = gray + d; out.data[o + 1] = gray; out.data[o + 2] = gray + (d ? 0 : 0); out.data[o + 3] = 255;
        }
        g.putImageData(out, 0, 0);
      } else {
        g.putImageData(img, -cx, -cy, cx, cy, cw, ch);
        if (mode === 'onion' && s.ref) { const t2 = new OffscreenCanvas(cw, ch); t2.getContext('2d').putImageData(s.mine, -cx, -cy, cx, cy, cw, ch); g.globalAlpha = S.alpha; g.drawImage(t2, 0, 0); }
      }
      const cg = c.getContext('2d'); cg.imageSmoothingEnabled = S.zoom < 1; cg.drawImage(tmp, 0, 0, c.width, c.height);
      return c;
    };
    const pair = document.createElement('div'); pair.className = 'pair';
    if (S.mode === 'side') { if (s.ref) pair.append(mk(s.ref)); pair.append(mk(s.mine)); }
    else if (S.mode === 'blink') {
      const c = mk(s.mine); pair.append(c);
      if (s.ref) { const r = mk(s.ref); let cur = c; S.timers.push(setInterval(() => { const next = cur === c ? r : c; cur.replaceWith(next); cur = next; }, 600)); }
    }
    else pair.append(mk(s.ref || s.mine, S.mode));
    div.append(pair); root.append(div);
  });
}
// Console/automation helpers. Predicates take [r,g,b]; regions are [x0,y0,x1,y1] in slide px.
const PRED = {
  dark: (p) => p[0] < 60 && p[1] < 60 && p[2] < 60,
  yellow: (p) => p[0] > 190 && p[1] > 140 && p[2] < 110,
  blue: (p) => p[2] > 180 && p[0] < 120 && p[2] - p[0] > 90,
  gray: (p) => { const m = (p[0] + p[1] + p[2]) / 3; return m < 150 && Math.max(...p) - Math.min(...p) < 30; },
  purple: (p) => p[2] > 150 && p[0] > 50 && p[0] < 140 && p[1] < 60,
  green: (p) => p[1] > 190 && p[0] < 190 && p[2] < 190 && p[1] - p[0] > 40,
  white: (p) => p[0] > 245 && p[1] > 245 && p[2] > 245,
};
function bbox(img, f, [x0, y0, x1, y1]) {
  let a = 1e9, b = 1e9, c = -1, d = -1, n = 0;
  for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
    const k = (y * img.width + x) * 4;
    if (f([img.data[k], img.data[k + 1], img.data[k + 2]])) { n++; if (x < a) a = x; if (y < b) b = y; if (x > c) c = x; if (y > d) d = y; }
  }
  return n ? [a, b, c, d] : null;
}
// review.measure(slideIndex1Based, 'dark', [x0,y0,x1,y1]) -> {ref, mine, delta}
S.measure = (i, pred, region) => {
  const s = S.slides[i - 1], f = typeof pred === 'function' ? pred : PRED[pred];
  const ref = s.ref ? bbox(s.ref, f, region) : null, mine = bbox(s.mine, f, region);
  return { ref, mine, delta: ref && mine ? mine.map((v, k) => v - ref[k]) : null };
};
// review.measureAll([[slide, name, pred, region], ...]) -> compact text table
S.measureAll = (list) => list.map(([i, name, p, r]) => { const m = S.measure(i, p, r); return `${i}.${name} ref ${JSON.stringify(m.ref)} mine ${JSON.stringify(m.mine)} d ${m.delta}`; }).join('\n');
S.pixel = (i, x, y) => { const s = S.slides[i - 1], k = (y * s.mine.width + x) * 4, h = (d) => '#' + [0, 1, 2].map((j) => d.data[k + j].toString(16).padStart(2, '0')).join(''); return { ref: s.ref && h(s.ref), mine: h(s.mine) }; };
S.reload = () => open(document.getElementById('post').value);
// review.show(slide, [x,y,w,h]?, zoom?, mode?) – single slide, cropped, for screenshots.
// mode 'ref' shows the reference alone (reading content), 'side'/'onion'/'diff' compare.
S.show = (i, crop = null, zoom = 0.3, mode = 'side') => {
  S.only = i; S.crop = crop; S.zoom = zoom; S.mode = mode === 'ref' ? 'side' : mode; draw();
  if (mode === 'ref') document.querySelectorAll('.pair canvas:nth-child(2)').forEach((c) => c.remove());
  document.querySelector('header').style.display = 'none'; document.querySelectorAll('.slide h3').forEach((h) => (h.style.display = 'none'));
  scrollTo(0, 0); return { viewport: [innerWidth, innerHeight], scale: `1 slide px = ${zoom} css px` };
};
// review.rankImages(slide, urls) – rank candidate full-slide renders (e.g. one per generated photo
// variant) by composition distance to the reference: mean colour difference of 24px blocks, so
// framing/colour layout counts and fine detail doesn't. Lower is better.
S.rankImages = async (i, urls) => {
  const ref = S.slides[i - 1].ref, out = [];
  for (const u of urls) {
    const im = await load(u + (u.includes('?') ? '&' : '?') + Date.now());
    const d = pixels(im, ref.width, ref.height).data; let s = 0, n = 0;
    for (let by = 0; by < ref.height; by += 24) for (let bx = 0; bx < ref.width; bx += 24) {
      const a = [0, 0, 0], b = [0, 0, 0];
      for (let y = by; y < Math.min(by + 24, ref.height); y += 4) for (let x = bx; x < Math.min(bx + 24, ref.width); x += 4) { const k = (y * ref.width + x) * 4; for (let j = 0; j < 3; j++) { a[j] += d[k + j]; b[j] += ref.data[k + j]; } }
      s += Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) + Math.abs(a[2] - b[2]); n += 108;
    }
    out.push([+(s / n).toFixed(1), u]);
  }
  return out.sort((a, b) => a[0] - b[0]).map(([v, u]) => `${v}  ${u}`).join('\n');
};
S.scores = () => S.slides.map((s, i) => `${i + 1} ${s.name} ${s.score ? s.score.similarity + '%' : 'no ref'}`).join('\n');
// review.layout(slide, [x0,y0,x1,y1]?, {src:'ref'|'mine', gapY:6, gapX:36, ink}) -> one row per blob:
// [x0,y0,x1,y1] w×h and the dominant ink colours. Rows are bands of ink separated by >= gapY empty
// rows; each band is split at horizontal gaps >= gapX. The default ink predicate is "not near
// white", so it suits light backgrounds; pass ink: p => … for others.
S.layout = (i, region, o = {}) => {
  const s = S.slides[i - 1], img = o.src === 'mine' ? s.mine : s.ref;
  const [x0, y0, x1, y1] = region || [0, 0, img.width, img.height];
  const ink = o.ink || ((p) => Math.min(...p) < 200 || Math.max(...p) - Math.min(...p) > 70);
  const gapY = o.gapY ?? 6, gapX = o.gapX ?? 36;
  const at = (x, y) => { const k = (y * img.width + x) * 4; return [img.data[k], img.data[k + 1], img.data[k + 2]]; };
  const rowHas = []; for (let y = y0; y < y1; y++) { let n = 0; for (let x = x0; x < x1; x++) if (ink(at(x, y))) n++; rowHas.push(n > 1); }
  const bands = []; let start = -1, gap = 0;
  rowHas.forEach((v, k) => { if (v) { if (start < 0) start = k; gap = 0; } else if (start >= 0 && ++gap >= gapY) { bands.push([start + y0, k - gap + y0]); start = -1; gap = 0; } });
  if (start >= 0) bands.push([start + y0, y1 - 1]);
  const out = [];
  for (const [by0, by1] of bands) {
    const col = []; for (let x = x0; x < x1; x++) { let n = 0; for (let y = by0; y <= by1; y++) if (ink(at(x, y))) n++; col.push(n > 0); }
    let sx = -1, g = 0;
    const flush = (ex) => {
      let a = 1e9, b = 1e9, c = -1, d = -1; const hist = {};
      for (let y = by0; y <= by1; y++) for (let x = sx + x0; x <= ex + x0; x++) { const p = at(x, y); if (!ink(p)) continue; a = Math.min(a, x); b = Math.min(b, y); c = Math.max(c, x); d = Math.max(d, y); const q = p.map((v) => Math.round(v / 24) * 24).join(','); hist[q] = (hist[q] || 0) + 1; }
      const top = Object.entries(hist).sort((u, v) => v[1] - u[1]).slice(0, 3).map(([k]) => '#' + k.split(',').map((v) => Math.min(255, +v).toString(16).padStart(2, '0')).join(''));
      if (c >= 0) out.push(`[${a},${b},${c},${d}] ${c - a + 1}x${d - b + 1} ${top.join(' ')}`);
    };
    col.forEach((v, k) => { if (v) { if (sx < 0) sx = k; g = 0; } else if (sx >= 0 && ++g >= gapX) { flush(k - g); sx = -1; g = 0; } });
    if (sx >= 0) flush(col.length - 1);
  }
  return out.join('\n');
};
// review.stats(slide, [x,y,w,h]) -> mean colour, luminance std-dev and lag-4 autocorrelation (grain
// size) for ref and render; use on a plain background patch to tune paper/crumpled backgrounds.
S.stats = (i, [x0, y0, w, h]) => {
  const one = (img) => {
    if (!img) return null;
    const L = (x, y) => { const k = (y * img.width + x) * 4; return (img.data[k] + img.data[k + 1] + img.data[k + 2]) / 3; };
    let s = [0, 0, 0], n = 0, sum = 0, sq = 0;
    for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) { const k = (y * img.width + x) * 4; for (let j = 0; j < 3; j++) s[j] += img.data[k + j]; const l = L(x, y); sum += l; sq += l * l; n++; }
    const mu = sum / n; let a = 0, b = 0;
    for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w - 4; x++) { const p = L(x, y) - mu, q = L(x + 4, y) - mu; a += p * q; b += p * p; }
    return { rgb: s.map((v) => Math.round(v / n)), sd: +Math.sqrt(sq / n - mu * mu).toFixed(2), corr4: +(a / b).toFixed(2) };
  };
  const s = S.slides[i - 1]; return { ref: one(s.ref), mine: one(s.mine) };
};
window.draw = draw; window.openPost = open;
init();
</script>
</body>
</html>
