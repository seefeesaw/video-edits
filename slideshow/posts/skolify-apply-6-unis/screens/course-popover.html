<!-- Faculty courses popover + yellow callout chevron. Slide coordinates. -->
<svg class="abs" style="left:573px;top:1140px" width="60" height="70" viewBox="0 0 60 70">
  <path d="M52 6 L14 35 L52 64" fill="none" stroke="#f5c518" stroke-width="11" stroke-linejoin="miter"/>
</svg>
<div class="pop" id="pop"></div>
<script>
  (() => {
    // [title lines, min APS, selected, top, height] (top relative to popover inner box)
    const items = [
      [['Diploma in Early Childhood Care', 'and Education'], 18, false, 0, 88],
      [['Higher Certificate in Education'], 18, true, 96, 61],
      [['Senior Phase Maths and Science', 'Education'], 18, true, 167, 81],
      [['Higher Certificate in Sports', 'Sciences'], 20, true, 258, 79],
      [['Higher Certificate in Sports', 'Sciences (Online)'], 20, false, 356, 76],
    ];
    const tick = '<svg width="27" height="27" viewBox="0 0 30 30"><path d="M9 15.5 L13.5 20 L21.5 11" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    let h = '';
    for (const [lines, aps, on, top, ht] of items) {
      const textH = lines.length * 20 + 18;
      const t0 = (ht - textH) / 2;
      h += `<div class="item ${on ? 'on' : 'off'}" style="top:${top}px;height:${ht}px">` +
        `<div class="t" style="top:${t0}px">${lines.join('<br>')}</div>` +
        `<div class="aps" style="top:${t0 + lines.length * 20 + 4}px">Min APS: ${aps}</div>` +
        `<div class="info" style="left:257px;top:${ht / 2 - 8}px">i</div>` +
        (on ? `<div class="tick" style="left:280px;top:${ht / 2 - 13.5}px">${tick}</div>` : `<div class="plus" style="left:281px;top:${ht / 2 - 14}px">+</div>`) +
        `</div>`;
    }
    h += '<div class="abs" style="left:0;top:458px;width:100%;height:1.5px;background:#ececec"></div>';
    h += '<div class="abs" style="left:20px;top:477px;font:700 13.9px/20px Inter;color:#1a1a1a;letter-spacing:-0.1px">3/6 total courses selected</div>';
    h += '<div class="abs" style="left:246px;top:470px;width:71px;height:31px;border-radius:16px;background:#161616;color:#fff;font:700 14.5px/31px Inter;text-align:center">Done</div>';
    document.getElementById('pop').innerHTML = h;
  })();
</script>
