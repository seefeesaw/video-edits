<div class="sk sk-marks">
  <div class="a sk-title" style="left:114px;top:41px">ENTER MARKS</div>
  <div class="a aps" style="left:444px;top:18px">21</div>

  <div class="a sk-desc" style="left:50px;top:144px">This will be used to calculate your APS and<br>recommend the best courses for YOU</div>

  <div id="rows"></div>
  <script>
    (() => {
      const rows = [
        ['Mathematics', 38, 2], ['Life Sciences', 62, 5], ['Accounting', 47, 3], ['Life Orientation', 70, 'LO'],
        ['Geography', 46, 3], ['English HL', 65, 5], ['Afrikaans HL', 41, 3],
      ];
      const bin = '<svg class="bin" viewBox="0 0 20 24"><rect x="1" y="3" width="18" height="3" rx="1.2" fill="#bdbdbd"/><rect x="7" y="0.5" width="6" height="3" rx="1" fill="#bdbdbd"/><path d="M3 7.5 H17 L15.8 22 C15.7 23 15 23.5 14 23.5 H6 C5 23.5 4.3 23 4.2 22 Z" fill="#bdbdbd"/></svg>';
      document.getElementById('rows').outerHTML = rows.map(([s, m, l], i) => {
        const lo = l === 'LO';
        return `<div class="row" style="top:${252 + i * 101.5}px"><div class="lbl">${s}</div>` +
          `<div class="mark" style="${lo ? 'left:230px;width:98px' : ''}">${m}</div>` +
          (lo ? '<div class="lo">LO</div>' : `<div class="lvl">${l}</div>${bin}`) + '</div>';
      }).join('');
    })();
  </script>

  <div class="a add" style="left:50px;top:977px;width:472px;height:69px">+ Add another subject</div>
  <div class="a sk-cta" style="left:115px;top:1068px;width:342px;height:52px">CONTINUE</div>
  <div class="a" style="left:565px;top:360px;width:4px;height:560px;border-radius:2px;background:#2a2a2a;opacity:.9"></div>
</div>
